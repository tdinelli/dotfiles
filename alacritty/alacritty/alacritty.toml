[bell]
animation = "EaseOutExpo"
color = "0xffffff"
duration = 0

[colors.primary]
background = '#ffffff'  # or '#f5f5f5' for softer white
foreground = '#000000'  # or '#333333' for softer black

[colors.normal]
black   = '#000000'
red     = '#d70000'
green   = '#008700'
yellow  = '#af8700'
blue    = '#0087ff'
magenta = '#af00db'
cyan    = '#00afaf'
white   = '#808080'

[colors.bright]
black   = '#808080'
red     = '#d75f00'
green   = '#00af00'
yellow  = '#d7af00'
blue    = '#5f87ff'
magenta = '#d787ff'
cyan    = '#00d7ff'
white   = '#d0d0d0'

[colors.cursor]
cursor = "#fb1d1d"
text = "#ffffff"

[cursor]
style = "Block"
unfocused_hollow = true

[env]
live_config_reload = "true"

[font]
size = 20.0

[font.normal]
# family = "Ibm Plex Mono"
family = "BlexMono Nerd Font Light"

[scrolling]
history = 5000
multiplier = 3

[terminal.shell]
program = "/bin/zsh"

[window]
decorations = "full"
startup_mode = "Windowed"
option_as_alt = "OnlyLeft"

[window.padding]
x = 3
y = 3

[terminal]
